[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "profetiq-forecaster"
version = "0.1.0"
description = "Python SDK for the ProfetiQ Forecaster API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "ProfetiQ" }]
dependencies = ["httpx>=0.27.0"]

[project.urls]
Homepage = "https://profetiq.com"

[tool.hatch.build.targets.wheel]
packages = ["profetiq_forecaster"]
